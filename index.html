<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IP Address Tracker</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />

 
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="header__title">IP Address Tracker</h1>

    <form class="search" id="search-form" novalidate>
      <label for="search-input" class="sr-only">IP adresi veya domain</label>
      <input
        class="search__input"
        id="search-input"
        type="text"
        placeholder="Search for any IP address or domain"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="search__button" type="submit" aria-label="Ara">
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="14" viewBox="0 0 11 14" aria-hidden="true">
          <path fill="none" stroke="#FFF" stroke-width="3" d="M2 1l6 6-6 6" />
        </svg>
      </button>
    </form>
    <p class="search__error" id="search-error" role="alert" hidden></p>
  </header>

  <main class="main">
    <section class="info" aria-live="polite">
      <div class="info__item">
        <h2 class="info__label">IP Address</h2>
        <p class="info__value" id="ip">—</p>
      </div>
      <div class="info__item">
        <h2 class="info__label">Location</h2>
        <p class="info__value" id="location">—</p>
      </div>
      <div class="info__item">
        <h2 class="info__label">Timezone</h2>
        <p class="info__value" id="timezone">—</p>
      </div>
      <div class="info__item">
        <h2 class="info__label">ISP</h2>
        <p class="info__value" id="isp">—</p>
      </div>
    </section>

    <div class="map" id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="script.js"></script>
</body>
</html>
